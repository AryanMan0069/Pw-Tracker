<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PW Lecture Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f5f4;--surface:#ffffff;--surface2:#fafaf9;
  --border:#e5e5e4;--border-strong:#d0d0ce;
  --text:#1a1a18;--text2:#5a5a57;--text3:#9a9a96;
  --accent:#FF5722;--accent-hover:#E64A19;
  --green:#22c55e;--green-bg:#f0fdf4;--green-text:#15803d;
  --blue-bg:#eff6ff;--blue-text:#1d4ed8;
  --amber-bg:#fffbeb;--amber-text:#b45309;
  --red-text:#dc2626;--red-bg:#fef2f2;
  --radius:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--surface:#1c1c1a;--surface2:#242422;
  --border:#2e2e2b;--border-strong:#3d3d3a;
  --text:#f0f0ed;--text2:#a8a8a4;--text3:#6a6a66;
  --green-bg:#052e16;--green-text:#4ade80;
  --blue-bg:#172554;--blue-text:#93c5fd;
  --amber-bg:#292107;--amber-text:#fbbf24;
  --red-bg:#2d0b0b;--red-text:#f87171;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.container{max-width:820px;margin:0 auto;padding:1.5rem 1rem 3rem;}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:12px;flex-wrap:wrap;}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.pw-logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:13px;flex-shrink:0;}
.app-title{font-size:16px;font-weight:600;color:var(--text);}
.app-sub{font-size:12px;color:var(--text3);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.sync-pill{font-size:12px;color:var(--text2);border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 10px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.sync-dot{width:7px;height:7px;border-radius:99px;background:var(--text3);}
.sync-dot.ok{background:var(--green);}
.sync-dot.warn{background:#f59e0b;}
.sync-dot.bad{background:var(--red-text);}
.view-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:3px;gap:2px;}
.vtab{padding:5px 13px;font-size:12px;font-weight:500;border:none;background:transparent;color:var(--text2);border-radius:6px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:5px;}
.vtab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

/* Buttons */
.btn-primary{background:var(--accent);color:white;border:none;padding:8px 15px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:background .15s;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-sec{background:var(--surface);color:var(--text2);border:1px solid var(--border-strong);padding:7px 13px;border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s;}
.btn-sec:hover{background:var(--surface2);}
.btn-ghost{background:transparent;border:none;color:var(--text3);cursor:pointer;padding:5px 7px;border-radius:6px;font-size:15px;line-height:1;transition:all .15s;}
.btn-ghost:hover{background:var(--surface2);color:var(--text2);}
.btn-ghost.danger:hover{background:var(--red-bg);color:var(--red-text);}

/* Dashboard */
.dash-overall{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem 1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow);}
.dash-bar-track{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
.dash-bar-fill{height:100%;border-radius:99px;transition:width .5s ease;background:var(--green);}
.dash-bar-fill.warn{background:#f59e0b;}
.dash-bar-fill.low{background:var(--accent);}
.dash-mini{text-align:center;padding:10px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);}
.dash-mini-val{font-size:18px;font-weight:600;color:var(--text);margin-bottom:2px;}
.dash-mini-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;font-weight:500;}

/* Subject cards */
.dash-section-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;margin-top:1.5rem;}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.subj-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem 1rem 1.4rem;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.subj-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.subj-card-accent{position:absolute;top:0;left:0;width:4px;height:100%;}
.subj-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;}
.subj-total{font-size:12px;color:var(--text3);margin-bottom:.8rem;}
.subj-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:.8rem;}
.subj-stat{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:center;}
.subj-stat-val{font-size:14px;font-weight:600;}
.subj-stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-top:1px;}
.subj-bar-track{height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.subj-bar-fill{height:100%;border-radius:99px;transition:width .5s ease;}
.subj-pct-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.subj-pct{font-size:12px;font-weight:600;}
.subj-hint{font-size:11px;color:var(--text3);text-align:right;margin-top:6px;}

/* Colors */
.ca0{background:#6366f1;} .ca1{background:#0ea5e9;} .ca2{background:#10b981;} .ca3{background:#f59e0b;} .ca4{background:#ec4899;} .ca5{background:#8b5cf6;} .ca6{background:#14b8a6;} .ca7{background:#f97316;} .ca8{background:#6366f1;} .ca9{background:#0ea5e9;}
.ct0{color:#6366f1;} .ct1{color:#0ea5e9;} .ct2{color:#10b981;} .ct3{color:#f59e0b;} .ct4{color:#ec4899;} .ct5{color:#8b5cf6;} .ct6{color:#14b8a6;} .ct7{color:#f97316;} .ct8{color:#6366f1;} .ct9{color:#0ea5e9;}

/* Tracker */
.sub-row{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.25rem;overflow-x:auto;}
.sub-row::-webkit-scrollbar{display:none;}
.stab{padding:8px 15px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:inherit;background:transparent;border-top:none;border-left:none;border-right:none;transition:color .15s;}
.stab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500;}
.stab:hover:not(.active){color:var(--text);}
.stab-add{padding:8px 10px;color:var(--text3);cursor:pointer;margin-bottom:-1px;display:flex;align-items:center;font-size:18px;border:none;background:transparent;}
.stab-add:hover{color:var(--text2);}
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;}
.stat-val{font-size:20px;font-weight:600;color:var(--text);}
.stat-val.green{color:var(--green);}
.stat-val.blue{color:var(--blue-text);}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:1.25rem;overflow:hidden;}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s ease;}
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.85rem;align-items:center;}
.cat-pill{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit;}
.cat-pill:hover{border-color:var(--accent);color:var(--accent);}
.cat-pill.active{background:var(--accent);color:white;border-color:var(--accent);}
.cat-pill-add{font-size:12px;padding:4px 11px;border-radius:99px;border:1px dashed var(--border-strong);background:transparent;color:var(--text3);cursor:pointer;font-family:inherit;transition:all .15s;}
.cat-pill-add:hover{border-color:var(--accent);color:var(--accent);}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:.85rem;}
.search-wrap{flex:1;position:relative;}
.search-wrap input{width:100%;font-size:13px;padding:7px 10px 7px 30px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;}
.search-wrap input:focus{outline:none;border-color:var(--accent);}
.search-wrap .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none;}
.filter-btn{font-size:12px;padding:7px 11px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:all .15s;}
.filter-btn.on{background:var(--green-bg);color:var(--green-text);border-color:var(--green);}
.lec-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:7px;display:flex;align-items:flex-start;gap:11px;transition:border-color .15s;}
.lec-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow);}
.check-btn{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--border-strong);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;transition:all .15s;}
.check-btn:hover{border-color:var(--green);}
.check-btn.done{background:var(--green);border-color:var(--green);}
.check-btn svg{width:11px;height:11px;stroke:white;fill:none;stroke-width:2.5;opacity:0;}
.check-btn.done svg{opacity:1;}
.lec-body{flex:1;min-width:0;}
.lec-title{font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:5px;line-height:1.4;}
.lec-title.striked{color:var(--text3);text-decoration:line-through;}
.lec-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;}
.b-date{color:var(--text3);}
.b-dur{background:var(--blue-bg);color:var(--blue-text);}
.b-cat{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.b-ch{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.b-dpp{background:var(--amber-bg);color:var(--amber-text);}
.card-actions{display:flex;gap:2px;flex-shrink:0;}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px;}
.empty i{font-size:32px;display:block;margin-bottom:10px;opacity:.4;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;}
.mtab-row{display:flex;gap:3px;margin-bottom:.9rem;background:var(--surface2);border-radius:var(--radius);padding:3px;}
.mtab{flex:1;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text2);border-radius:6px;text-align:center;border:none;background:transparent;font-family:inherit;transition:all .15s;}
.mtab.active{background:var(--surface);color:var(--text);font-weight:500;box-shadow:var(--shadow);}
.fr{margin-bottom:11px;}
.fr label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500;}
.fr input,.fr select,.fr textarea{width:100%;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-family:inherit;}
.fr input:focus,.fr select:focus,.fr textarea:focus{outline:none;border-color:var(--accent);}
.fr textarea{min-height:100px;resize:vertical;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.checkbox-row{display:flex;align-items:center;gap:8px;}
.checkbox-row input{width:auto;accent-color:var(--accent);}
.checkbox-row label{font-size:13px;color:var(--text2);cursor:pointer;margin:0;font-weight:400;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;}
.parse-hint{font-size:12px;color:var(--text3);margin-bottom:8px;line-height:1.6;}
.err-msg{font-size:12px;color:var(--red-text);margin-top:6px;display:none;}
.rename-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.rename-row input{flex:1;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-family:inherit;}
.rename-row input:focus{outline:none;border-color:var(--accent);}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px;margin-top:14px;}
.danger-zone{border:1px solid #fecaca;border-radius:var(--radius);padding:12px;background:var(--red-bg);}
.danger-zone p{font-size:12px;color:var(--red-text);margin-bottom:8px;}

/* Auth */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--bg);}
.auth-card{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.35rem;box-shadow:var(--shadow-md);}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:1.2rem;}
.auth-card h1{font-size:18px;font-weight:600;color:var(--text);}
.auth-card p{font-size:13px;color:var(--text3);line-height:1.5;margin-top:3px;}
.auth-card input{width:100%;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 11px;font-family:inherit;margin-bottom:9px;}
.auth-card input:focus{outline:none;border-color:var(--accent);}
.auth-error{display:none;font-size:12px;color:var(--red-text);background:var(--red-bg);border:1px solid #fecaca;border-radius:var(--radius);padding:8px 10px;margin:8px 0;}
.auth-note{font-size:12px;color:var(--text3);line-height:1.5;margin-top:11px;}

@media(max-width:520px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .f2{grid-template-columns:1fr;}
  .subj-grid{grid-template-columns:1fr;}
}
</style>
</head>

<div class="container" id="appShell">
  <div class="topbar">
    <div class="logo-wrap">
      <div class="pw-logo">PW</div>
      <div><div class="app-title">PW Lecture Tracker</div><div class="app-sub">Dropper · IIT JEE</div></div>
    </div>
    <div class="topbar-right">

        <button class="vtab" id="vtab-tracker" onclick="setView('tracker')"><i class="ti ti-list"></i> Tracker</button>

      <button class="btn-primary" id="addLecBtn" onclick="openAddModal()" style="display:none"><i class="ti ti-plus"></i> Add</button>
    </div>

  <div id="view-dashboard">

    <div id="dashSubjects"></div>

    <div class="sub-row" id="subRow"></div>
    <div class="stats-row">

      <div class="stat"><div class="stat-label">Done</div><div class="stat-val green" id="sDone">0</div></div>
      <div class="stat"><div class="stat-label">Time left</div><div class="stat-val blue" id="sTime">—</div></div>
      <div class="stat"><div class="stat-label">Progress</div><div class="stat-val" id="sPct">0%</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <div class="cat-row" id="catRow"></div>
    <div class="ctrl-row">
      <div class="search-wrap"><i class="ti ti-search si"></i><input type="text" id="searchBox" placeholder="Search lectures…" oninput="render()"></div>
      <button class="filter-btn" id="filterDoneBtn" onclick="toggleHideDone()"><i class="ti ti-eye-off"></i> Hide done</button>
      <button class="btn-sec" onclick="openManageModal()" style="padding:7px 10px;"><i class="ti ti-settings" style="font-size:15px;"></i></button>
    </div>
    <div id="list"></div>
  </div>
</div>

function uid(){return Date.now()+Math.floor(Math.random()*99999);}
function durToMins(s){if(!s)return 0;const h=s.match(/(\d+)h/),m=s.match(/(\d+)m/);return(h?+h[1]*60:0)+(m?+m[1]:0);}
function minsToStr(m){if(!m)return'—';const h=Math.floor(m/60),mn=m%60;return h>0?(mn>0?h+'h '+mn+'m':h+'h'):mn+'m';}
function parseDate(d){if(!d)return new Date(0);const mo={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};const p=d.split(' ');return new Date(+p[2],mo[p[1]],+p[0]);}

function defaultData(){
  return{subjects:DEFAULTS.map(s=>({...s,categories:[...s.categories]})),lectures:DEMO.map(l=>({...l}))};
}
function isSupabaseConfigured(){
  return SUPABASE_CONFIG.url.startsWith('https://')&&
    SUPABASE_CONFIG.anonKey.length>30&&
    !SUPABASE_CONFIG.url.includes('YOUR_')&&
    !SUPABASE_CONFIG.anonKey.includes('YOUR_');
}
function setSyncStatus(text,state='warn'){
  const el=document.getElementById('syncStatus');if(!el)return;
  const dot=state==='ok'?'ok':state==='bad'?'bad':'warn';
  el.innerHTML=`<span class="sync-dot ${dot}"></span><span>${text}</span>`;
}
function saveLocal(){
  try{localStorage.setItem('pw_tracker_final',JSON.stringify(data));}catch(e){}
}
function save(){
  saveLocal();
  if(sb){
    setSyncStatus('Saving','warn');
    clearTimeout(syncTimer);
    syncTimer=setTimeout(syncNow,350);
  }else{
    setSyncStatus('Local only',isSupabaseConfigured()?'warn':'bad');
  }
}
async function syncNow(){
  if(!sb)return;
  const payload={tracker_id:SUPABASE_CONFIG.rowId,data,updated_at:new Date().toISOString()};
  const {data:row,error}=await sb.from(SUPABASE_CONFIG.table).upsert(payload,{onConflict:'tracker_id'}).select('updated_at').single();
  if(error){setSyncStatus('Sync failed','bad');console.error(error);return;}
  remoteUpdatedAt=row?.updated_at||payload.updated_at;
  setSyncStatus('Synced','ok');
}
async function load(){
  try{const r=localStorage.getItem('pw_tracker_final');if(r){data=JSON.parse(r);}else throw 0;}
  catch(e){data=defaultData();}
  activeSub=data.subjects[0]?.id||null;
  renderAll();

  if(!sb){setSyncStatus('Local only',isSupabaseConfigured()?'warn':'bad');return;}
  setSyncStatus('Loading','warn');
  const {data:row,error}=await sb.from(SUPABASE_CONFIG.table).select('data,updated_at').eq('tracker_id',SUPABASE_CONFIG.rowId).maybeSingle();
  if(error){setSyncStatus('Sync failed','bad');console.error(error);return;}
  if(row?.data){
    data=row.data;
    remoteUpdatedAt=row.updated_at;
    saveLocal();
  }else{
    await syncNow();
  }
  activeSub=data.subjects[0]?.id||null;
  renderAll();
  setSyncStatus('Synced','ok');
}

async function init(){
  if(isSupabaseConfigured()){
    sb=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);
    await load();
    return;
  }
  await load();
}

/* ---- Dashboard ---- */
function getStats(subId){
  const lecs=subId?data.lectures.filter(l=>l.subjectId===subId):data.lectures;
  const total=lecs.length,done=lecs.filter(l=>l.done).length;
  const leftMins=lecs.filter(l=>!l.done).reduce((a,l)=>a+durToMins(l.duration),0);
  const pct=total?Math.round(done/total*100):0;
  return{total,done,remaining:total-done,leftMins,pct};
}

  const all=getStats(null);
  const barCls=all.pct>=70?'':all.pct>=35?'warn':'low';

  document.getElementById('dashOverall').innerHTML=`

        <div style="display:flex;align-items:baseline;gap:10px;">
          <div style="font-size:40px;font-weight:700;color:var(--text);line-height:1;">${all.done}<span style="font-size:22px;color:var(--text3);font-weight:500;">/${all.total}</span></div>

        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-width:210px;max-width:340px;">
        <div class="dash-mini"><div class="dash-mini-val" style="color:var(--green);">${all.done}</div><div class="dash-mini-label">Completed</div></div>
        <div class="dash-mini"><div class="dash-mini-val" style="color:var(--accent);">${all.remaining}</div><div class="dash-mini-label">Remaining</div></div>
        <div class="dash-mini"><div class="dash-mini-val" style="color:var(--blue-text);font-size:15px;">${minsToStr(all.leftMins)}</div><div class="dash-mini-label">Time Left</div></div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px;">
      <span>Overall completion</span><span style="font-weight:600;color:var(--text);">${all.pct}%</span>
    </div>
    <div class="dash-bar-track"><div class="dash-bar-fill ${barCls}" style="width:${all.pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:5px;">
      <span>${data.subjects.length} subjects · ${data.lectures.length} total lectures</span>

  // Group into '27 and '26 (and others)

    const m=s.name.match(/'\d+$/);
    const yr=m?m[0]:'Other';
    if(!groups[yr])groups[yr]=[];
    groups[yr].push({s,i});
  });

  let html='';
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(yr=>{
    html+=`<div class="dash-section-title">${yr==='Other'?'Other subjects':yr+' Batch'}</div><div class="subj-grid">`;
    groups[yr].forEach(({s,i})=>{
      const st=getStats(s.id);
      const col=COLORS[i%COLORS.length];
      const barW=st.pct+'%';
      html+=`<div class="subj-card" onclick="goToSubject('${s.id}')">
        <div class="subj-card-accent" style="background:${col};"></div>
        <div class="subj-name">${s.name}</div>

        <div class="subj-stats">

          <div class="subj-stat"><div class="subj-stat-val" style="color:var(--accent);">${st.remaining}</div><div class="subj-stat-label">Left</div></div>

  const sub=getCurSub();
  if(!sub){document.getElementById('list').innerHTML='<div class="empty"><i class="ti ti-books"></i>No subjects yet.</div>';return;}

  // Category pills
  document.getElementById('catRow').innerHTML=
    `<button class="cat-pill ${activeCat==='all'?'active':''}" data-cat="__all__">All</button>`+
    sub.categories.map((c,i)=>`<button class="cat-pill ${activeCat===c?'active':''}" data-cat-idx="${i}">${c}</button>`).join('')+
    `<button class="cat-pill-add" data-cat-add="1"><i class="ti ti-plus"></i> New category</button>`;

  let lecs=data.lectures.filter(l=>l.subjectId===activeSub);
  const total=lecs.length,done=lecs.filter(l=>l.done).length;
  const leftMins=lecs.filter(l=>!l.done).reduce((a,l)=>a+durToMins(l.duration),0);
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sDone').textContent=done;

  const q=(document.getElementById('searchBox').value||'').toLowerCase();
  if(q)lecs=lecs.filter(l=>(l.title+l.chapter+l.category).toLowerCase().includes(q));
  lecs.sort((a,b)=>parseDate(a.date)-parseDate(b.date));

  const el=document.getElementById('list');
  if(!lecs.length){el.innerHTML=`<div class="empty"><i class="ti ti-notebook"></i>${total===0?'No lectures yet. Click <strong>Add</strong> to get started.':'No lectures match your filters.'}</div>`;return;}

      </button>
      <div class="lec-body">

        <div class="lec-meta">
          ${l.date?`<span class="badge b-date"><i class="ti ti-calendar" style="font-size:10px;vertical-align:-1px;margin-right:2px;"></i>${l.date}</span>`:''}
          ${l.duration?`<span class="badge b-dur"><i class="ti ti-clock" style="font-size:10px;vertical-align:-1px;margin-right:2px;"></i>${l.duration}</span>`:''}
          ${l.category?`<span class="badge b-cat">${l.category}</span>`:''}
          ${l.chapter?`<span class="badge b-ch">${l.chapter}</span>`:''}

        </div>

        <button class="btn-ghost danger" onclick="deleteLec(${l.id})"><i class="ti ti-trash"></i></button>

  data.subjects.push({id:'s'+uid(),name:n,categories:['Regular Lectures']});
  activeSub=data.subjects[data.subjects.length-1].id;activeCat='all';
  save();renderAll();
}
function promptAddCategory(){
  const sub=getCurSub();if(!sub)return;
  const name=prompt('New category name:\n(e.g. "MBBS by Manish Sir", "Extra Dose", "Revision in One Shot")');

  if(sub.categories.includes(n)){alert('Already exists.');return;}
  sub.categories.push(n);activeCat=n;save();render();

function submitPaste(){
  const raw=document.getElementById('f-paste').value.trim();
  const cat=document.getElementById('f-cat2').value;
  if(!raw){alert('Please paste some text.');return;}
  const parsed=parsePW(raw,cat);
  if(!parsed.length){document.getElementById('parse-err').style.display='block';return;}
  data.lectures.push(...parsed);
  save();closeModal();render();renderDashboard();
}

function parsePW(raw,cat){
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const skip=['Watch','Resume','Notes & more','Attempt DPP','Notes','Auto Fetch'];
  const dateRe=/^\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{4}$/i;
  const durRe=/^(\d+)h[:\s](\d+)m$/i;
  const dppRe=/DPP.*MCQ Quiz|MCQ Quiz/i;
  const res=[];let i=0;
  while(i<lines.length){
    if(/^Lecture$/i.test(lines[i])){
      const l={id:uid(),subjectId:activeSub,category:cat,title:'',chapter:'',date:'',duration:'',hasDPP:false,done:false};
      i++;
      if(i<lines.length&&dateRe.test(lines[i])){l.date=lines[i];i++;}
      if(i<lines.length&&!skip.includes(lines[i])&&!durRe.test(lines[i])&&!/^Lecture$/i.test(lines[i])){
        l.title=lines[i].replace(/\s*\|\|\s*NO DPP\s*/gi,'').trim();i++;
      }
      if(i<lines.length&&durRe.test(lines[i])){const m=lines[i].match(durRe);l.duration=m[1]+'h '+m[2]+'m';i++;}
      while(i<lines.length&&!/^Lecture$/i.test(lines[i])){if(dppRe.test(lines[i]))l.hasDPP=true;i++;}
      if(l.title){l.chapter=guessChapter(l.title);res.push(l);}
    }else{i++;}
  }
  return res;
}

function guessChapter(t){
  const map=[
    [/error in meas/i,'Error in Measurements'],[/mathematical tool/i,'Mathematical Tools'],
    [/motion in a straight/i,'Motion in a Straight Line'],[/motion in a plane/i,'Motion in a Plane'],
    [/relative motion/i,'Relative Motion'],[/laws of motion/i,'Laws of Motion'],
    [/work.*energy/i,'Work, Energy and Power'],[/circular/i,'Circular Motion'],
    [/centre of mass/i,'Centre of Mass'],[/gravitation/i,'Gravitation'],
    [/trigono/i,'Trigonometry'],[/differenti/i,'Differentiation'],[/integrat/i,'Integration'],
    [/limit/i,'Limits'],[/function/i,'Functions'],[/sets/i,'Sets'],
    [/mole concept/i,'Mole Concept'],[/atomic/i,'Atomic Structure'],
    [/chemical bonding/i,'Chemical Bonding'],[/thermodynamics/i,'Thermodynamics'],
    [/equilibrium/i,'Equilibrium'],[/hydrocarbon/i,'Hydrocarbons'],
  ];
  for(const[r,c]of map)if(r.test(t))return c;
  return'';
}

function renameSubject(){
  const sub=getCurSub();if(!sub)return;
  const n=document.getElementById('ren-sub').value.trim();
  if(!n){alert('Name cannot be empty.');return;}
  sub.name=n;save();renderAll();openManageModal();
}
function renameCat(i){
  const sub=getCurSub();if(!sub)return;
  const n=document.getElementById('ren-cat-'+i).value.trim();
  if(!n){alert('Name cannot be empty.');return;}
  const old=sub.categories[i];sub.categories[i]=n;
  data.lectures=data.lectures.map(l=>l.subjectId===activeSub&&l.category===old?{...l,category:n}:l);
  if(activeCat===old)activeCat=n;
  save();render();renderDashboard();openManageModal();
}
function deleteCat(i){
  const sub=getCurSub();if(!sub)return;
  const c=sub.categories[i];
  if(!confirm(`Delete category "${c}"? Lectures stay but lose their category.`))return;
  sub.categories.splice(i,1);
  if(activeCat===c)activeCat='all';
  save();render();renderDashboard();openManageModal();
}
function deleteSubject(){
  const sub=getCurSub();if(!sub)return;
  if(!confirm(`Delete "${sub.name}" and ALL its lectures? Cannot be undone.`))return;
  data.subjects=data.subjects.filter(s=>s.id!==activeSub);
  data.lectures=data.lectures.filter(l=>l.subjectId!==activeSub);
  activeSub=data.subjects[0]?.id||null;activeCat='all';
  save();closeModal();renderAll();
}

/* ---- Delegated listeners ---- */
document.getElementById('subRow').addEventListener('click',function(e){
  const btn=e.target.closest('button');if(!btn)return;
  if(btn.dataset.subId){setSub(btn.dataset.subId);return;}
  if(btn.dataset.subAdd)promptAddSubject();
});
document.getElementById('catRow').addEventListener('click',function(e){
  const btn=e.target.closest('button');if(!btn)return;
  if(btn.dataset.cat==='__all__'){setCat('all');return;}
  if(btn.dataset.catIdx!==undefined){const sub=getCurSub();if(sub)setCat(sub.categories[+btn.dataset.catIdx]);return;}
  if(btn.dataset.catAdd)promptAddCategory();
});

init();
</script>
</body>
</html>
